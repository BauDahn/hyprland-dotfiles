# GPU: la pantalla (eDP) está cableada a la AMD (sin MUX), así que Hyprland corre en la iGPU.
# La NVIDIA RTX 3050 se usa solo para apps pesadas con `prime-run <app>` (modo Hybrid de supergfxctl).
# Las variables de abajo forzaban TODO a la NVIDIA y despertaban la dGPU; si algún día querés
# Hyprland sobre la NVIDIA, descomentalas y agregá AQ_DRM_DEVICES con la NVIDIA primero.
# env = LIBVA_DRIVER_NAME,nvidia
# env = NVD_BACKEND,direct
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Cursor
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24

# Qt
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland;xcb

cursor {
    no_hardware_cursors = true
}
