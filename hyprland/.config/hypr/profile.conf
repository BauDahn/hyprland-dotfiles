# GENERADO por scripts/theme.sh (perfil: minimal) — no editar a mano
general {
    gaps_in = 8
    gaps_out = 16
    border_size = 1
    col.active_border = $primary $secondary 45deg
    col.inactive_border = $inactive
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 10
        passes = 2
        noise = 0.02
        contrast = 0.95
        brightness = 0.9
        vibrancy = 0.2
        vibrancy_darkness = 0.3
        new_optimizations = true
        popups = true
    }

    shadow {
        enabled = false
        range = 20
        render_power = 3
        color = $shadow
    }

    
}

debug {
    damage_tracking = 2
}

animations {
    enabled = yes
    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = linear, 0, 0, 1, 1
    animation = windows, 1, 5, smooth, popin 85%
    animation = windowsOut, 1, 4, smooth, popin 85%
    animation = fade, 1, 4, smooth
    animation = layers, 1, 4, smooth, fade
    animation = workspaces, 1, 5, smooth, fade
    animation = specialWorkspace, 1, 5, smooth, slidefadevert 20%
    animation = border, 1, 8, default
    animation = borderangle, 1, 60, linear, loop
}
