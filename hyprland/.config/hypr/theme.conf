# Colores de wallust: colores en colors.conf; gaps, blur, animaciones en profile.conf (generado por theme.sh)

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-rofi
    match:namespace = rofi
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-swaync
    match:namespace = swaync-control-center
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = anim-rofi
    match:namespace = rofi
    animation = popin 80%
}

layerrule {
    name = blur-overview
    match:namespace = overview
    blur = true
    ignore_alpha = 0.1
    animation = fade
}
