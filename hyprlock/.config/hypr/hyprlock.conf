source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 3, smooth
}

# Fondo = el wallpaper actual (lo copia wallpaper.sh)
background {
    monitor =
    path = ~/.cache/wallpaper/lockscreen.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    vibrancy = 0.15
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $lk_text
    font_size = 130
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Segundos + fecha
label {
    monitor =
    text = cmd[update:1000] echo "$(LC_TIME=es_AR.UTF-8 date +"%A, %d de %B")"
    color = $lk_accent
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Panel detrás del input
shape {
    monitor =
    size = 420, 190
    color = $lk_panel
    rounding = 28
    border_size = 2
    border_color = $lk_accent $lk_accent2 45
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾  Hola, $USER
    color = $lk_text
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $lk_accent
    inner_color = $lk_inner
    font_color = $lk_text
    check_color = $lk_ok
    fail_color = $lk_fail
    capslock_color = rgb(f9e2af)
    rounding = 20
    fade_on_empty = false
    placeholder_text = <i>Contraseña...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -110
    halign = center
    valign = center
}

# Layout de teclado
label {
    monitor =
    text = $LAYOUT
    color = $lk_dim
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -165
    halign = center
    valign = center
}

# Música (arriba a la izquierda)
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-info.sh music
    color = $lk_accent2
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 30, -30
    halign = left
    valign = top
}

# Batería (abajo a la derecha)
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh battery
    color = $lk_text
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}

# Perfil activo (abajo a la izquierda)
label {
    monitor =
    text = cmd[update:5000] echo "󰏘  $(cat ~/.cache/wallpaper/profile 2>/dev/null)"
    color = $lk_dim
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}
