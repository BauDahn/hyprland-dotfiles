general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 2:30 — atenuar el brillo suavemente (y apagar luz del teclado)
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/dim.sh down; brightnessctl -sd asus::kbd_backlight set 0
    on-resume = ~/.config/hypr/scripts/dim.sh up; brightnessctl -rd asus::kbd_backlight
}

# 4:30 — aviso
listener {
    timeout = 270
    on-timeout = notify-send -u low -t 8000 "󰌾 Bloqueando" "La sesión se bloquea en 30 segundos"
}

# 5:00 — bloquear
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5:30 — apagar pantalla (ya bloqueada)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 15:00 — suspender
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
